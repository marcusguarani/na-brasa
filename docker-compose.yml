services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: nabrasa
      DB_USER: nabrasa
      DB_PASSWORD: nabrasa
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nabrasa_net

  database:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: nabrasa
      MYSQL_USER: nabrasa
      MYSQL_PASSWORD: nabrasa
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      nabrasa_net:
        ipv4_address: 172.28.0.10

networks:
  nabrasa_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  database_data:
